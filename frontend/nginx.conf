# Static-asset server for the built SPA (used inside Dockerfile.prod). This container serves ONLY the
# frontend bundle; API requests are expected to be routed to the backend by whatever sits in front of
# this container (e.g. infrastructure/nginx/nginx.conf.example, an ALB, or Render's own routing).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets (Vite filenames include a content hash) are safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA deep-link refresh: unknown paths fall back to index.html, never cached so a new deploy is seen.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
