<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 2400" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Gaussian Blur Filters for Atmospheric Depth -->
    <filter id="bg-blur-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="65" />
    </filter>
    <filter id="bg-blur-mid" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
    <filter id="bg-blur-edge" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <!-- Translucent Purple & Lavender Gradient Flow -->
    <linearGradient id="ribbon-flow-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.30" />
      <stop offset="30%" stop-color="#C084FC" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#DDD6FE" stop-opacity="0.14" />
      <stop offset="85%" stop-color="#FED7AA" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0" />
    </linearGradient>

    <!-- Warm Peach to Lavender Flow -->
    <linearGradient id="ribbon-flow-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.24" />
      <stop offset="30%" stop-color="#C084FC" stop-opacity="0.16" />
      <stop offset="65%" stop-color="#DDD6FE" stop-opacity="0.10" />
      <stop offset="90%" stop-color="#FED7AA" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0" />
    </linearGradient>

    <!-- Gentle Lower Dashboard Ambient Sweep -->
    <linearGradient id="ribbon-flow-3" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#DDD6FE" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#FED7AA" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#E9D5FF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Golden Highlight Ribbon Edge -->
    <linearGradient id="edge-glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#FEF08A" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#FDBA74" stop-opacity="0.22" />
      <stop offset="90%" stop-color="#DDD6FE" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0" />
    </linearGradient>

    <!-- Secondary Soft Lavender Edge -->
    <linearGradient id="edge-glow-lavender" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#C084FC" stop-opacity="0.30" />
      <stop offset="75%" stop-color="#DDD6FE" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Ambient Lighting Blobs Spanning the Entire Document Height -->
  <g filter="url(#bg-blur-heavy)">
    <!-- Upper Hero: Natural sunlight and lavender glow -->
    <ellipse cx="1220" cy="160" rx="360" ry="240" fill="#FEF08A" opacity="0.20" />
    <ellipse cx="320" cy="220" rx="420" ry="280" fill="#C084FC" opacity="0.18" />
    
    <!-- Mid Section 1: Behind KPI cards & Transitions -->
    <ellipse cx="940" cy="540" rx="440" ry="260" fill="#FED7AA" opacity="0.14" />
    <ellipse cx="180" cy="620" rx="380" ry="240" fill="#DDD6FE" opacity="0.15" />

    <!-- Mid Section 2: Behind Sales, Invoice Status & GST Summary -->
    <ellipse cx="280" cy="950" rx="420" ry="280" fill="#C084FC" opacity="0.12" />
    <ellipse cx="1120" cy="1150" rx="420" ry="260" fill="#FEF3C7" opacity="0.11" />

    <!-- Lower Section 1: Behind Recent Invoices & Quick Actions -->
    <ellipse cx="320" cy="1580" rx="450" ry="290" fill="#E9D5FF" opacity="0.09" />
    <ellipse cx="980" cy="1720" rx="440" ry="270" fill="#FED7AA" opacity="0.07" />

    <!-- Lower Section 2: Bottom Sections & Footer -->
    <ellipse cx="720" cy="2150" rx="520" ry="280" fill="#FEF9C3" opacity="0.06" />
    <ellipse cx="180" cy="2250" rx="380" ry="250" fill="#DDD6FE" opacity="0.05" />
  </g>

  <!-- Layer 2: Flowing Ribbons That Weave Gracefully Down the Page -->
  
  <!-- Ribbon 1: Upper hero into KPI area -->
  <g filter="url(#bg-blur-mid)">
    <path d="M 460,-40 C 340,110 160,230 70,350 C -30,470 20,600 160,700 C 310,800 580,780 780,710 C 980,640 1140,500 1310,420 L 1400,460 C 1190,560 990,710 750,780 C 510,860 220,870 70,760 C -80,650 -120,470 -20,320 C 70,160 260,40 380,-40 Z" fill="url(#ribbon-flow-1)" />
  </g>
  <path d="M 440,-30 C 320,120 140,240 50,360 C -40,480 0,610 140,710 C 290,810 560,790 760,720 C 960,650 1120,510 1290,430" fill="none" stroke="url(#edge-glow-gold)" stroke-width="3.5" filter="url(#bg-blur-edge)" opacity="0.55" />

  <!-- Ribbon 2: Sweeping across KPI cards into Charts & Tables -->
  <g filter="url(#bg-blur-mid)">
    <path d="M 1280,520 C 1080,710 780,880 500,1010 C 230,1140 90,1260 130,1410 C 170,1560 390,1640 630,1610 C 870,1580 1100,1440 1300,1350 L 1370,1400 C 1140,1520 890,1670 610,1700 C 340,1730 80,1640 30,1440 C -20,1240 120,1090 390,950 C 660,810 970,640 1190,460 Z" fill="url(#ribbon-flow-2)" />
  </g>
  <path d="M 1250,500 C 1050,690 750,860 480,990 C 210,1120 70,1240 110,1390 C 150,1540 360,1620 600,1590 C 840,1560 1070,1420 1270,1330" fill="none" stroke="url(#edge-glow-lavender)" stroke-width="3" filter="url(#bg-blur-edge)" opacity="0.40" />

  <!-- Ribbon 3: Gentle lower dashboard wave flowing behind Recent Invoices to bottom -->
  <g filter="url(#bg-blur-mid)">
    <path d="M 60,1420 C 230,1560 490,1680 750,1780 C 1010,1880 1190,1980 1220,2110 C 1250,2240 1130,2340 930,2380 C 740,2420 510,2380 340,2310 L 310,2380 C 490,2450 730,2490 960,2440 C 1190,2390 1340,2270 1300,2090 C 1260,1910 1060,1800 780,1700 C 510,1600 220,1470 20,1350 Z" fill="url(#ribbon-flow-3)" />
  </g>
  <path d="M 40,1400 C 210,1540 470,1660 730,1760 C 990,1860 1170,1960 1200,2090 C 1230,2220 1110,2320 910,2360" fill="none" stroke="url(#edge-glow-gold)" stroke-width="2.2" filter="url(#bg-blur-edge)" opacity="0.22" />

  <!-- Layer 3: Ambient Light Particles Scattered Naturally Down the Dashboard -->
  <g opacity="0.6">
    <circle cx="210" cy="180" r="2.2" fill="#FEF08A" filter="url(#bg-blur-edge)" />
    <circle cx="380" cy="120" r="1.8" fill="#FDE68A" />
    <circle cx="540" cy="260" r="2.5" fill="#FFFFFF" />
    <circle cx="820" cy="140" r="2.0" fill="#FED7AA" />
    <circle cx="1040" cy="220" r="2.4" fill="#FEF08A" filter="url(#bg-blur-edge)" />

    <!-- Particles in middle section -->
    <circle cx="180" cy="740" r="2.0" fill="#DDD6FE" />
    <circle cx="480" cy="860" r="2.4" fill="#FFFFFF" filter="url(#bg-blur-edge)" />
    <circle cx="890" cy="780" r="1.8" fill="#FED7AA" />
    <circle cx="1220" cy="920" r="2.2" fill="#FEF08A" />
    
    <!-- Particles in lower section -->
    <circle cx="280" cy="1480" r="1.8" fill="#DDD6FE" />
    <circle cx="680" cy="1620" r="2.0" fill="#FED7AA" />
    <circle cx="1120" cy="1780" r="1.7" fill="#FEF08A" />
    <circle cx="450" cy="2100" r="1.6" fill="#DDD6FE" />
  </g>
</svg>
